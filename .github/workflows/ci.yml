name: NeoForge CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Build and test
        run: ./gradlew build --no-daemon --stacktrace
      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: terminatorplus-neoforge
          path: |
            build/libs/*.jar
            build/test-results/test/*.xml
