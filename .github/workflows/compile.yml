name: "Compile"

on: [push, pull_request]

# This port targets Minecraft 1.21.1 and Java 21. Keep the workflow explicit so
# a future branch cannot silently pick an incompatible runtime.
jobs:
  gradle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Execute Gradle build and tests
        run: ./gradlew build --no-daemon --stacktrace

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TerminatorPlus
          path: |
            build/libs/
            TerminatorPlus-API/build/libs
